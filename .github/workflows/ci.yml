name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Windows: the desktop app packages with WiX, and the runner image includes the Android SDK.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # No signing keys exist here: release builds come out unsigned, which is enough to prove they build.
      - name: Tests
        run: ./gradlew test --console=plain
      - name: Lint (shared module and both Android editions)
        run: ./gradlew :bluetooth:lintDebug :app:lintGithubDebug :app:lintPlayDebug :app:lintPlayRelease --console=plain
      - name: Edition checks (Play cannot self-install, GitHub has no ad SDK)
        run: ./gradlew :app:verifyEditions --console=plain
      - name: Android builds (GitHub APK, Play APK, shrunk release builds, Play release bundle)
        run: ./gradlew :app:assembleGithubDebug :app:assemblePlayDebug :app:assembleGithubRelease :app:bundlePlayRelease --console=plain
      - name: Windows tests and installer
        run: ./gradlew :desktop:test :desktop:packageMsi --console=plain
      - name: Upload builds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: handoff-${{ github.sha }}
          path: |
            app/build/outputs/apk/github/debug/*.apk
            app/build/outputs/apk/play/debug/*.apk
            app/build/outputs/bundle/playRelease/*.aab
            desktop/build/compose/binaries/main/msi/*.msi
          retention-days: 14
