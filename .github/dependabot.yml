# Weekly pull requests for outdated or vulnerable dependencies. CI must pass before they are merged.
version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    groups:
      androidx:
        patterns: ["androidx.*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*", "org.jetbrains.kotlinx*", "com.google.devtools.ksp*"]
      compose:
        patterns: ["org.jetbrains.compose*", "androidx.compose*"]
    open-pull-requests-limit: 5
    ignore:
      # protobuf-javalite comes with the Google ads SDK, which is built against 3.x; only patch 3.x here.
      - dependency-name: "com.google.protobuf:protobuf-javalite"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
